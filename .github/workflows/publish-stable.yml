name: Prepare signed firmware release

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel
        required: true
        type: choice
        options: [pilot, stable]
      legacy_bridge:
        description: Also publish the stable transition manifest for existing WOOD 16 MB devices
        required: false
        default: false
        type: boolean
      version:
        description: Semantic firmware version, without v prefix
        required: true
        type: string
      generation:
        description: Monotonically increasing OTA generation
        required: true
        type: number
      security_version:
        description: Anti-downgrade security version
        required: true
        type: number
      board:
        description: Exact hardware profile
        required: true
        type: choice
        options: [esp32s3-n16r8, esp32s3wood-n16r8, esp32s3wood-n8r8, esp32s3echobase-n8r8, esp32s3echobase-n16r8]
      partition_layout:
        description: OTA partition layout
        required: true
        type: choice
        options: [ota-v1-4m, ota-v1-2m]
      asset_name:
        description: Existing .bin asset in release vVERSION
        required: true
        type: string
      min_updater:
        description: Oldest firmware version that can install this update
        required: true
        type: string
      notes_de:
        description: Short German release note
        required: true
        type: string
      notes_en:
        description: Short English release note
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
concurrency:
  group: publish-stable
  cancel-in-progress: false

jobs:
  prepare-manifest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: stable-release
    env:
      LEGACY_BRIDGE: ${{ inputs.legacy_bridge }}
      CHANNEL: ${{ inputs.channel }}
      VERSION: ${{ inputs.version }}
      GENERATION: ${{ inputs.generation }}
      SECURITY_VERSION: ${{ inputs.security_version }}
      BOARD: ${{ inputs.board }}
      PARTITION_LAYOUT: ${{ inputs.partition_layout }}
      ASSET_NAME: ${{ inputs.asset_name }}
      MIN_UPDATER: ${{ inputs.min_updater }}
      NOTES_DE: ${{ inputs.notes_de }}
      NOTES_EN: ${{ inputs.notes_en }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - name: Validate untrusted dispatch inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CHANNEL" == stable || "$CHANNEL" == pilot ]]
          if [[ "$LEGACY_BRIDGE" == true ]]; then
            [[ "$CHANNEL" == stable && "$BOARD" == esp32s3wood-n16r8 ]]
          fi
          if [[ "$CHANNEL" == pilot ]]; then
            [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-pilot\.[1-9][0-9]*$ ]]
          else
            [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          fi
          [[ "$MIN_UPDATER" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          [[ "$ASSET_NAME" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*\.bin$ ]]
          [[ "$GENERATION" =~ ^[1-9][0-9]*$ ]]
          [[ "$SECURITY_VERSION" =~ ^[0-9]+$ ]]
      - name: Download immutable release asset
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release"
          gh release download "v$VERSION" --repo "$GITHUB_REPOSITORY" --pattern "$ASSET_NAME" --dir "$RUNNER_TEMP/release"
          test -f "$RUNNER_TEMP/release/$ASSET_NAME"
      - name: Materialize signing key
        shell: bash
        env:
          OTA_SIGNING_KEY_PEM: ${{ secrets.OTA_SIGNING_KEY_PEM }}
        run: |
          set -euo pipefail
          test -n "$OTA_SIGNING_KEY_PEM"
          umask 077
          printf '%s\n' "$OTA_SIGNING_KEY_PEM" > "$RUNNER_TEMP/ota-signing-key.pem"
      - name: Reject replayed generation
        shell: bash
        run: |
          set -euo pipefail
          python - "$GENERATION" "$SECURITY_VERSION" "$CHANNEL" "$BOARD" <<'PY'
          import base64, json, pathlib, sys
          requested = int(sys.argv[1])
          requested_security = int(sys.argv[2])
          paths = [pathlib.Path(f"channels/{channel}/{sys.argv[4]}/manifest.json") for channel in ("stable","pilot")]
          if sys.argv[4] == "esp32s3wood-n16r8":
              paths.append(pathlib.Path("channels/stable/manifest.json"))
          for path in paths:
              document = json.loads(path.read_text())
              if document.get("state") != "unconfigured":
                  current = json.loads(base64.b64decode(document["payload"], validate=True))
                  if requested <= current["generation"]:
                      raise SystemExit("generation must exceed both board channels")
                  if requested_security < current["security_version"]:
                      raise SystemExit("security version must not decrease across channels")
          PY
      - name: Sign and verify manifest
        shell: bash
        run: |
          set -euo pipefail
          python tools/sign_manifest.py --channel "$CHANNEL" \
            --image "$RUNNER_TEMP/release/$ASSET_NAME" --private-key "$RUNNER_TEMP/ota-signing-key.pem" \
            --version "$VERSION" --generation "$GENERATION" --security-version "$SECURITY_VERSION" \
            --board "$BOARD" --partition-layout "$PARTITION_LAYOUT" --asset-name "$ASSET_NAME" \
            --min-updater "$MIN_UPDATER" --notes-de "$NOTES_DE" --notes-en "$NOTES_EN" \
            --output "channels/$CHANNEL/$BOARD/manifest.json"
          python tools/validate_manifest.py "channels/$CHANNEL/$BOARD/manifest.json"
          python tools/verify_manifest_signature.py "channels/$CHANNEL/$BOARD/manifest.json"
          if [[ "$LEGACY_BRIDGE" == true ]]; then
            cp "channels/$CHANNEL/$BOARD/manifest.json" channels/stable/manifest.json
          fi
      - name: Remove private key
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/ota-signing-key.pem"
      - name: Open release approval pull request
        shell: bash
        run: |
          set -euo pipefail
          branch="release/${CHANNEL}-${BOARD}-${VERSION}-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add "channels/$CHANNEL/$BOARD/manifest.json"
          if [[ "$LEGACY_BRIDGE" == true ]]; then git add channels/stable/manifest.json; fi
          git commit -m "release: prepare $CHANNEL firmware $VERSION"
          git push origin "$branch"
          if ! gh pr create --base main --head "$branch" \
            --title "release: publish $CHANNEL firmware $VERSION" \
            --body "Signed $CHANNEL manifest for $BOARD firmware $VERSION. Verify image provenance and hardware acceptance before merging."; then
            echo "::warning::Automatic PR creation unavailable. Signed branch is preserved."
            printf 'Create the approval PR manually: https://github.com/%s/compare/main...%s\n' "$GITHUB_REPOSITORY" "$branch" >> "$GITHUB_STEP_SUMMARY"
          fi
